services:
  db:
    image: postgis/postgis:18-3.6
    container_name: colmaps-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-colmaps}
      POSTGRES_USER: ${DB_USER:-colmaps}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-colmaps_pwd}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - colmaps_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  data-pipeline:
    build:
      context: ./data-pipeline
      dockerfile: Dockerfile

    container_name: colmaps-data-pipeline

    volumes:
      - colmaps_raw_data:/app/data-pipeline/raw
      - colmaps_filtered_data:/app/data-pipeline/filtered
      - colmaps_processed_data:/app/data-pipeline/processed

  data-import:
    build:
      context: ./database
      dockerfile: Dockerfile

    container_name: colmaps-data-import

    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-colmaps}
      DB_USER: ${DB_USER:-colmaps}
      DB_PASSWORD: ${DB_PASSWORD:-colmaps_pwd}

    volumes:
      - colmaps_processed_data:/app/data-pipeline/processed

    depends_on:
      db:
        condition: service_healthy
      data-pipeline:
        condition: service_completed_successfully
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: colmaps-backend

    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-colmaps}
      DB_USER: ${DB_USER:-colmaps}
      DB_PASSWORD: ${DB_PASSWORD:-colmaps_pwd}
      PORT: 3000

      TSC_WATCHFILE: FixedPollingInterval

    ports:
      - "${BACKEND_PORT:-3000}:3000"

    volumes:
      - ./backend:/app/backend
      - backend_node_modules:/app/backend/node_modules

    depends_on:
      data-import:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: colmaps-frontend

    environment:
      NODE_ENV: development
      NG_ALLOWED_HOSTS: localhost

    ports:
      - "${FRONTEND_PORT:-4200}:4200"

    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_angular_cache:/app/frontend/.angular

    depends_on:
      backend:
        condition: service_started
volumes:
  colmaps_postgres_data:
  colmaps_raw_data:
  colmaps_filtered_data:
  colmaps_processed_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_angular_cache:
