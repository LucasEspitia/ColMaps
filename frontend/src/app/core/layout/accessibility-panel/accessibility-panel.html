<tui-drawer
  *tuiPopup="accessibility.panelOpen()"
  tuiFocusTrap
  role="dialog"
  aria-modal="true"
  aria-labelledby="accessibility-title"
  aria-describedby="accessibility-description"
  direction="end"
  [overlay]="true"
  class="w-[min(26rem,100vw)]"
  (tuiClose)="close()"
>
  <!-- Panel heading -->
  <header class="flex w-full min-w-0 flex-col">
    <div class="flex w-full items-center justify-between gap-4">
      <h1 id="accessibility-title" class="text-2xl font-bold text-cm-text">Accessibility</h1>

      <button
        id="accessibility-close"
        tuiButton
        tuiAutoFocus
        type="button"
        appearance="secondary"
        size="s"
        iconStart="@tui.x"
        aria-label="Close accessibility settings"
        (click)="close()"
      >
        Close
      </button>
    </div>

    <p id="accessibility-description" class="mt-2 text-sm leading-relaxed text-cm-text-muted">
      Customize your experience while exploring ColMaps.
    </p>
  </header>

  <div class="flex min-w-0 flex-col gap-8 py-6">
    <!-- Typography -->
    <fieldset class="min-w-0 space-y-5">
      <legend>
        <h2 class="text-lg font-semibold text-cm-text">Typography</h2>
      </legend>

      <!-- Text size -->
      <div class="min-w-0">
        <label tuiLabel>
          Text size

          <tui-textfield
            tuiChevron
            class="mt-2 w-full"
            [stringify]="formatTextScale"
            [tuiTextfieldCleaner]="false"
          >
            <input
              id="accessibility-text-scale"
              tuiSelect
              [ngModel]="accessibility.preferences().textScale"
              (ngModelChange)="setTextScale($event)"
            />

            <ng-template #scaleOption let-item>
              {{ formatTextScale(item) }}
            </ng-template>

            <tui-data-list-wrapper *tuiDropdown [items]="textScales" [itemContent]="scaleOption" />
          </tui-textfield>
        </label>
      </div>

      <!-- Text spacing -->
      <div class="min-w-0">
        <label tuiLabel>
          Text spacing

          <tui-textfield
            tuiChevron
            class="mt-2 w-full"
            [stringify]="formatTextSpacing"
            [tuiTextfieldCleaner]="false"
          >
            <input
              id="accessibility-text-spacing"
              tuiSelect
              [ngModel]="accessibility.preferences().textSpacing"
              (ngModelChange)="setTextSpacing($event)"
            />

            <ng-template #spacingOption let-item>
              {{ formatTextSpacing(item) }}
            </ng-template>

            <tui-data-list-wrapper
              *tuiDropdown
              [items]="textSpacingOptions"
              [itemContent]="spacingOption"
            />
          </tui-textfield>
        </label>
      </div>
    </fieldset>

    <hr class="border-cm-border/30" />

    <!-- Appearance -->
    <fieldset class="min-w-0 space-y-5">
      <legend>
        <h2 class="text-lg font-semibold text-cm-text">Appearance</h2>
      </legend>

      <!-- Color palette -->
      <div class="min-w-0">
        <label tuiLabel>
          Color palette

          <tui-textfield
            tuiChevron
            class="mt-2 w-full"
            [stringify]="formatColorMode"
            [tuiTextfieldCleaner]="false"
          >
            <input
              id="accessibility-color-mode"
              tuiSelect
              [ngModel]="accessibility.preferences().colorVisionMode"
              (ngModelChange)="setColorVisionMode($event)"
            />

            <ng-template #colorOption let-item>
              {{ formatColorMode(item) }}
            </ng-template>

            <tui-data-list-wrapper
              *tuiDropdown
              [items]="colorModeValues"
              [itemContent]="colorOption"
            />
          </tui-textfield>
        </label>

        <p class="mt-2 text-sm leading-relaxed text-cm-text-muted">
          Choose an alternative palette to help distinguish colors.
        </p>
      </div>

      <!-- High contrast -->
      <label class="flex cursor-pointer items-center justify-between gap-4">
        <span class="flex min-w-0 flex-col gap-1">
          <span class="font-medium text-cm-text"> High contrast </span>

          <span class="text-sm leading-relaxed text-cm-text-muted">
            Increase visual contrast across the interface.
          </span>
        </span>

        <input
          id="accessibility-high-contrast"
          tuiSwitch
          type="checkbox"
          class="shrink-0"
          [ngModel]="accessibility.preferences().highContrast"
          (ngModelChange)="accessibility.setHighContrast($event)"
        />
      </label>

      <!-- Underline links -->
      <label class="flex cursor-pointer items-center justify-between gap-4">
        <span class="flex min-w-0 flex-col gap-1">
          <span class="font-medium text-cm-text"> Underline links </span>

          <span class="text-sm leading-relaxed text-cm-text-muted">
            Make links easier to identify.
          </span>
        </span>

        <input
          id="accessibility-underline-links"
          tuiSwitch
          type="checkbox"
          class="shrink-0"
          [ngModel]="accessibility.preferences().underlineLinks"
          (ngModelChange)="accessibility.setUnderlineLinks($event)"
        />
      </label>
    </fieldset>

    <hr class="border-cm-border/30" />

    <!-- Motion -->
    <fieldset class="min-w-0 space-y-5">
      <legend>
        <h2 class="text-lg font-semibold text-cm-text">Motion</h2>
      </legend>

      <!-- Reduce motion -->
      <label class="flex cursor-pointer items-center justify-between gap-4">
        <span class="flex min-w-0 flex-col gap-1">
          <span class="font-medium text-cm-text"> Reduce motion </span>

          <span class="text-sm leading-relaxed text-cm-text-muted">
            Minimize non-essential animations and transitions.
          </span>
        </span>

        <input
          id="accessibility-reduced-motion"
          tuiSwitch
          type="checkbox"
          class="shrink-0"
          [ngModel]="accessibility.preferences().reducedMotion"
          (ngModelChange)="accessibility.setReducedMotion($event)"
        />
      </label>
    </fieldset>

    <!-- Reset -->
    <div class="border-t border-cm-border/30 pt-6">
      <button
        id="accessibility-reset"
        tuiButton
        type="button"
        appearance="outline"
        size="m"
        class="w-full"
        (click)="reset()"
      >
        Reset preferences
      </button>
    </div>

    <p class="text-sm leading-relaxed text-cm-text-muted">
      These preferences are stored in your browser. You can change or reset them at any time.
    </p>
  </div>
</tui-drawer>
