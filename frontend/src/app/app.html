<tui-root tuiTheme="light">
  <div
    class="flex min-h-dvh flex-col bg-cm-background text-cm-text"
    [class.h-dvh]="isFullscreen()"
    [class.overflow-hidden]="isFullscreen()"
  >
    <app-navbar class="shrink-0" />

    <app-accessibility-panel />

    <main class="min-h-0 flex-1" [class.overflow-hidden]="isFullscreen()">
      <router-outlet />
    </main>

    @if (!isFullscreen()) {
      <app-footer />
    }
  </div>
</tui-root>
