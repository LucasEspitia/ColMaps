<section aria-labelledby="discover-title" class="bg-cm-background py-16 sm:py-24">
  <div class="mx-auto w-full max-w-[1400px] px-6 sm:px-12 lg:px-20">
    <div class="mb-12 max-w-2xl">
      <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-cm-primary">
        Discover Colombia
      </p>

      <h2 id="discover-title" class="text-3xl font-bold tracking-tight text-cm-text sm:text-4xl">
        A country full of possibilities.
      </h2>

      <p class="mt-4 text-lg leading-relaxed text-cm-text-muted">
        Explore Colombia's diversity through its landscapes, culture and unforgettable destinations.
      </p>
    </div>

    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (category of categories; track category.title) {
        <article tuiCardLarge appearance="floating" class="min-w-0 overflow-hidden">
          <div class="aspect-4/5 overflow-hidden rounded-cm-md">
            <picture>
              <source
                type="image/webp"
                [attr.srcset]="
                  '/images/discover/' +
                  category.image +
                  '-320.webp 320w, ' +
                  '/images/discover/' +
                  category.image +
                  '-640.webp 640w, ' +
                  '/images/discover/' +
                  category.image +
                  '-960.webp 960w'
                "
                sizes="(min-width: 1400px) 290px, (min-width: 1024px) 22vw, (min-width: 640px) 44vw, 90vw"
              />

              <img
                [src]="'/images/discover/' + category.image + '-640.webp'"
                [alt]="category.alt"
                width="640"
                height="800"
                loading="lazy"
                decoding="async"
                class="block h-full w-full object-cover"
              />
            </picture>
          </div>

          <div>
            <h3 class="text-xl font-semibold text-cm-text">
              {{ category.title }}
            </h3>

            <p class="mt-2 leading-relaxed text-cm-text-muted">
              {{ category.description }}
            </p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
