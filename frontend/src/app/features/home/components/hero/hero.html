<section
  aria-labelledby="hero-title"
  class="relative isolate flex min-h-[70svh] items-center overflow-hidden bg-cm-primary text-white sm:min-h-[75svh]"
>
  <!-- Full-width responsive image -->
  <picture class="absolute inset-0 -z-10">
    <source
      type="image/webp"
      srcset="
        /images/hero/cocora-640.webp   640w,
        /images/hero/cocora-1280.webp 1280w,
        /images/hero/cocora-1920.webp 1920w
      "
      sizes="100vw"
    />

    <img
      src="/images/hero/cocora-1280.webp"
      alt=""
      width="1920"
      height="1080"
      loading="eager"
      fetchpriority="high"
      decoding="async"
      class="h-full w-full object-cover object-center"
    />
  </picture>

  <!-- Dark green overlay -->
  <div
    aria-hidden="true"
    class="absolute inset-0 -z-10 bg-linear-to-r from-[color-mix(in_srgb,var(--cm-primary)_92%,black)] via-[color-mix(in_srgb,var(--cm-primary)_55%,transparent)] to-transparent"
  ></div>

  <!-- Content constrained to 1400px -->
  <div class="mx-auto w-full max-w-[1400px] px-6 py-16 sm:px-12 lg:px-20">
    <div class="max-w-2xl">
      <p
        class="mb-5 flex items-center gap-3 text-sm font-semibold uppercase tracking-[0.2em] text-white"
      >
        <span aria-hidden="true" class="h-1 w-8 rounded-full bg-cm-accent"></span>
        Discover Colombia
      </p>

      <h1
        id="hero-title"
        class="text-4xl font-bold leading-tight tracking-tight sm:text-5xl lg:text-7xl"
      >
        Colombia is yours to explore.
      </h1>

      <p class="mt-6 max-w-xl text-base leading-relaxed text-white/90 sm:text-lg">
        Discover remarkable places, explore new destinations, and experience Colombia through
        ColMaps.
      </p>

      <div class="mt-9 flex flex-wrap gap-4">
        <a routerLink="/search" tuiButton appearance="primary" size="l" class="hero-cta-primary">
          Try It
        </a>

        <a routerLink="/map" tuiButton appearance="secondary" size="l"> Explore Map </a>
      </div>
    </div>
  </div>
</section>
