<section class="mx-auto w-full max-w-[1440px] px-4 py-6 lg:px-8">
  <header class="mb-5">
    <h1 class="text-2xl text-cm-text">Explore Colombia</h1>

    <p class="text-sm text-cm-text-muted">Discover places and plan your next adventure.</p>
  </header>

  <div class="relative h-[70dvh] min-h-[420px] overflow-hidden rounded-2xl border shadow-sm">
    <app-map-canvas class="block h-full w-full" (poiSelected)="onPoiSelected($event)" />
    @if (selectedPoi(); as poi) {
      <app-poi-preview
        class="absolute bottom-4 left-4 right-4 z-10 md:top-4 md:bottom-auto md:left-auto md:w-80"
        [poi]="poi"
        (closed)="closePoiPreview()"
      />
    }
  </div>
</section>
