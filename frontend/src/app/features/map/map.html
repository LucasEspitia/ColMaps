<section
  class="relative h-full min-h-0 w-full overflow-hidden"
  aria-label="Explore places in Colombia"
>
  <!-- Floating exploration controls -->
  <app-map-toolbar
    class="absolute left-3 right-3 top-3 z-20 sm:left-5 sm:right-auto sm:top-5 sm:max-w-[calc(100%-2.5rem)]"
    [selectedCategories]="selectedCategories()"
    (categoriesChanged)="onCategoriesChanged($event)"
  />

  <!-- Map -->
  <app-map-canvas
    class="block h-full w-full"
    [categories]="selectedCategories()"
    (poiSelected)="onPoiSelected($event)"
  />

  <!-- Selected POI -->
  @if (selectedPoi(); as poi) {
    <app-poi-preview
      class="absolute bottom-4 left-4 right-4 z-10 md:left-auto md:w-96"
      [poi]="poi"
      [detailState]="poiDetailState()"
      (closed)="closePoiPreview()"
    />
  }
</section>
